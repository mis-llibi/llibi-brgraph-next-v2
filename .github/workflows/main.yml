name: CI - Lint and Build

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install --frozen-lockfile

      - name: ✅ Lint (errors only)
        run: npm lint

      - name: 🔧 Build project
        run: npm build
